project_name: metal_classifier

dataset:
  root_dir: "C:/MetalData"
  image_height: 288
  image_width: 512
  random_seed: 42

augmentation:
  random_resized_crop_scale: [0.6, 1.0]
  random_resized_crop_ratio: [1.6, 1.95]
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation_degrees: 10
  brightness: 0.15
  contrast: 0.15
  saturation: 0.0
  hue: 0.0
  gaussian_blur_prob: 0.2

model:
  architecture: convnext_tiny   # convnext_tiny | efficientnet_v2_s | efficientnet_b3
  pretrained: true
  dropout: 0.3
  freeze_backbone_epochs: 3

training:
  epochs: 40
  batch_size: 16
  head_lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.05
  label_smoothing: 0.1
  class_weighting: true
  scheduler: cosine
  min_lr: 0.000001
  early_stopping_patience: 8
  gradient_clip: 1.0
  num_workers: 4
  mixed_precision: true

paths:
  models_dir: "models"
  logs_dir: "logs"
  best_model_name: "best_model.pth"
  last_checkpoint_name: "last_checkpoint.pt"
  class_labels_name: "class_labels.json"

logging:
  tensorboard: true
  csv_log: true
  print_every_n_batches: 20